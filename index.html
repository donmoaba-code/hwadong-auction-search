<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화동경매 검색툴 V26.08.04</title>
  <style>
    :root {
      --bg: #f3efe8;
      --panel: #fffdf9;
      --ink: #1f2933;
      --muted: #667788;
      --line: #d8cfc3;
      --accent: #9a3412;
      --accent-soft: #c2410c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(154, 52, 18, 0.10), transparent 55%),
        linear-gradient(180deg, #f7f2ea 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 24px;
      box-shadow: 0 18px 40px rgba(60, 40, 20, 0.08);
    }
    h1 {
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .desc {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .desc a { color: var(--accent-soft); }
    label.field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .source-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #faf7f2;
    }
    .source-box label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0;
    }
    .search-wrap { position: relative; flex: 1 1 220px; min-width: 0; }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
      background: #fff;
    }
    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.12);
    }
    .suggest {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      max-height: 260px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(60, 40, 20, 0.12);
    }
    .suggest.open { display: block; }
    .suggest button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 10px 12px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: normal;
      line-height: 1.4;
      border-bottom: 1px solid #f0e9e0;
    }
    .suggest button:last-child { border-bottom: 0; }
    .suggest button:hover,
    .suggest button.active {
      background: #fff7ed;
    }
    .suggest .meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-search {
      background: var(--accent);
      color: #fff;
    }
    .btn-search:hover { background: var(--accent-soft); }
    .btn-search:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-reset {
      background: #efe8de;
      color: var(--ink);
    }
    .btn-reset:hover { background: #e5ddd1; }
    .options {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      font-size: 0.88rem;
    }
    .options label.chk {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      cursor: pointer;
      margin: 0;
    }
    .preview {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #faf7f2;
      min-height: 52px;
    }
    .preview-title {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.84rem;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.primary {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .chip.converted {
      border-color: #b45309;
      background: #fff7ed;
    }
    .chip.source {
      border-color: #1d4ed8;
      background: #eff6ff;
      color: #1e3a8a;
      cursor: default;
    }
    .chip.best {
      border-color: #047857;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 700;
    }
    .chip .n {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .status {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .muted { color: var(--muted); font-size: 0.84rem; }
  </style>
  <script src="hanja_convert.js"></script>
</head>
<body>
  <main class="card">
    <h1>화동경매 검색툴 V26.08.04</h1>
    <p class="desc" id="desc">
      실제 화동 상품명 목록으로 검색어를 고른 뒤
      <a href="https://www.hwadongauction.com/search/search" target="_blank" rel="noopener">화동옥션</a>
      /
      <a href="https://www.hwadong.com/new/search/auctionSearch.jsp" target="_blank" rel="noopener">화동양행</a>
      원본 검색을 새 창으로 엽니다.
    </p>

    <form id="searchForm" autocomplete="off">
      <div class="source-box" role="radiogroup" aria-label="검색 대상">
        <label>
          <input type="radio" name="searchSource" value="auction" checked />
          화동옥션 검색
        </label>
        <label>
          <input type="radio" name="searchSource" value="yanghang" />
          화동양행 검색
        </label>
      </div>

      <label class="field-label" for="keyword">검색어 (상품명 / 상품번호 / Lot번호)</label>
      <div class="row">
        <div class="search-wrap">
          <input
            type="search"
            id="keyword"
            name="keyword"
            placeholder="예: 지급어음, 1,000환, 제일은행"
            autofocus
          />
          <div class="suggest" id="suggest" role="listbox" aria-label="상품명 제안"></div>
        </div>
        <button type="submit" class="btn-search" id="btnSearch">검색 (원본 새 창)</button>
        <button type="button" class="btn-reset" id="btnReset">초기화</button>
      </div>

      <div class="options">
        <label class="chk">
          <input type="checkbox" id="useCatalog" checked />
          상품명 목록으로 최적 검색어 선택
        </label>
        <label class="chk">
          <input type="checkbox" id="dualHanja" checked />
          한자·표기 변환 후보 포함
        </label>
      </div>
    </form>

    <div class="preview" id="preview">
      <div class="preview-title">검색 후보 (목록 매칭 건수)</div>
      <div class="chips" id="chips"><span class="muted">검색어를 입력하면 후보가 표시됩니다.</span></div>
    </div>

    <p class="hint" id="hint">
      목록에 더 많이 나오는 표기를 고르고, 띄어쓴 검색어는 AND로 찾아
      제목 안의 연속 구간(예: <code>500원 백동화 - 1982年</code>)으로 원본 창 <b>1개</b>를 엽니다.
    </p>
    <p class="status" id="catalogStatus">상품명 목록 불러오는 중…</p>

    <div class="actions">
      <button type="button" class="btn-reset" id="btnOpenList">화동옥션 종료경매 목록</button>
      <button type="button" class="btn-reset" id="btnOpenYanghang">화동양행 검색 페이지</button>
    </div>
  </main>

  <script>
    const AUCTION_SEARCH_URL = "https://www.hwadongauction.com/search/search";
    const AUCTION_LIST_URL = "https://www.hwadongauction.com/end/endAuctionList";
    const YANGHANG_SEARCH_URL = "https://www.hwadong.com/new/search/auctionSearch.jsp";
    const API_BASES = ["http://127.0.0.1:8765", ""];
    const MAX_CANDIDATES = 8;
    const MAX_SUGGEST = 8;

    const form = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const useCatalog = document.getElementById("useCatalog");
    const dualHanja = document.getElementById("dualHanja");
    const chips = document.getElementById("chips");
    const hint = document.getElementById("hint");
    const btnSearch = document.getElementById("btnSearch");
    const suggestEl = document.getElementById("suggest");
    const catalogStatus = document.getElementById("catalogStatus");

    let titles = [];
    let catalogReady = false;
    let suggestItems = [];
    let suggestIndex = -1;
    let previewTimer = null;

    function getSource() {
      const el = form.querySelector('input[name="searchSource"]:checked');
      return el ? el.value : "auction";
    }

    function buildSearchUrl(keyword, source) {
      if (source === "yanghang") {
        const url = new URL(YANGHANG_SEARCH_URL);
        url.searchParams.set("hiddenSearchKey", keyword);
        url.searchParams.set("resultsearch", "Y");
        url.searchParams.set("Page", "1");
        return url.toString();
      }
      const url = new URL(AUCTION_SEARCH_URL);
      url.searchParams.set("keyword", keyword);
      return url.toString();
    }

    function getRawKeyword() {
      return keywordInput.value.trim();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sourceLabel(source) {
      return source === "yanghang" ? "화동양행" : "화동옥션";
    }

    function countInCatalog(keyword) {
      if (!catalogReady || !keyword) return 0;
      let n = 0;
      for (let i = 0; i < titles.length; i++) {
        if (titles[i].includes(keyword)) n++;
      }
      return n;
    }

    function tokenize(query) {
      return String(query || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    }

    function tokenVariants(token) {
      const out = [];
      const add = (v) => {
        const s = String(v || "").trim();
        if (s && !out.includes(s)) out.push(s);
      };
      add(token);
      if (/^\d{4}$/.test(token)) {
        add(token + "年");
        add(token + "년");
      }
      if (dualHanja.checked && window.HwadongHanja) {
        HwadongHanja.expandSearchKeywords(token).forEach(add);
      }
      return out;
    }

    function titleHasToken(title, token) {
      const vars = tokenVariants(token);
      for (let i = 0; i < vars.length; i++) {
        if (title.includes(vars[i])) return true;
      }
      return false;
    }

    function titleHasAllTokens(title, tokens) {
      for (let i = 0; i < tokens.length; i++) {
        if (!titleHasToken(title, tokens[i])) return false;
      }
      return true;
    }

    function countAndMatches(tokens) {
      if (!catalogReady || !tokens.length) return 0;
      let n = 0;
      for (let i = 0; i < titles.length; i++) {
        if (titleHasAllTokens(titles[i], tokens)) n++;
      }
      return n;
    }

    function findAndTitles(tokens, limit) {
      if (!catalogReady || !tokens.length) return [];
      const out = [];
      for (let i = 0; i < titles.length; i++) {
        const t = titles[i];
        if (!titleHasAllTokens(t, tokens)) continue;
        out.push(t);
        if (limit && out.length >= limit) break;
      }
      return out;
    }

    /** 제목에서 모든 토큰을 포함하는 가장 짧은 연속 구간 */
    function shortestCoveringSpan(title, tokens) {
      const hits = [];
      tokens.forEach((token, ti) => {
        tokenVariants(token).forEach((v) => {
          let from = 0;
          for (;;) {
            const idx = title.indexOf(v, from);
            if (idx < 0) break;
            hits.push({ start: idx, end: idx + v.length, ti });
            from = idx + 1;
          }
        });
      });
      const need = tokens.length;
      const present = new Set(hits.map((h) => h.ti));
      if (present.size < need) return null;
      hits.sort((a, b) => a.start - b.start || a.end - b.end);

      let best = null;
      for (let i = 0; i < hits.length; i++) {
        const count = Object.create(null);
        let got = 0;
        let end = 0;
        for (let j = i; j < hits.length; j++) {
          const h = hits[j];
          count[h.ti] = (count[h.ti] || 0) + 1;
          if (count[h.ti] === 1) got += 1;
          end = Math.max(end, h.end);
          if (got === need) {
            const span = title.slice(hits[i].start, end);
            if (titleHasAllTokens(span, tokens) && (!best || span.length < best.length)) {
              best = span;
            }
            break;
          }
        }
      }
      return best;
    }

    function pickCoveringKeyword(tokens, matchLimit) {
      const matches = findAndTitles(tokens, matchLimit || 300);
      if (!matches.length) return null;
      const spanFreq = new Map();
      matches.forEach((title) => {
        const span = shortestCoveringSpan(title, tokens) || title;
        spanFreq.set(span, (spanFreq.get(span) || 0) + 1);
      });
      let bestSpan = null;
      let bestFreq = -1;
      spanFreq.forEach((freq, span) => {
        if (
          !bestSpan ||
          freq > bestFreq ||
          (freq === bestFreq && span.length < bestSpan.length)
        ) {
          bestSpan = span;
          bestFreq = freq;
        }
      });
      return {
        keyword: bestSpan,
        hits: matches.length,
        matches,
        spanFreq: bestFreq,
      };
    }

    function buildCandidates(raw) {
      const out = [];
      const add = (k) => {
        const v = String(k || "").trim();
        if (!v || out.includes(v)) return;
        out.push(v);
      };
      add(raw);
      const tokens = tokenize(raw);
      if (tokens.length >= 2) {
        const cover = pickCoveringKeyword(tokens, 300);
        if (cover && cover.keyword) add(cover.keyword);
        tokens.forEach((t) => {
          add(t);
          if (dualHanja.checked && window.HwadongHanja) {
            HwadongHanja.expandSearchKeywords(t).forEach(add);
          }
        });
      }
      if (dualHanja.checked && window.HwadongHanja) {
        HwadongHanja.expandSearchKeywords(raw).forEach(add);
      }
      return out.slice(0, 24);
    }

    function rankCandidates(raw) {
      const tokens = tokenize(raw);
      const cands = buildCandidates(raw);
      const andHits = tokens.length >= 2 && useCatalog.checked && catalogReady
        ? countAndMatches(tokens)
        : 0;
      return cands
        .map((keyword) => {
          let hits = 0;
          if (useCatalog.checked && catalogReady) {
            if (keyword === raw && tokens.length >= 2) hits = andHits;
            else hits = countInCatalog(keyword);
          }
          return {
            keyword,
            hits,
            isRaw: keyword === raw,
            isCover: tokens.length >= 2 && keyword !== raw && titleHasAllTokens(keyword, tokens),
          };
        })
        .sort((a, b) => {
          if (b.hits !== a.hits) return b.hits - a.hits;
          if (a.isCover !== b.isCover) return a.isCover ? -1 : 1;
          if (a.isRaw !== b.isRaw) return a.isRaw ? -1 : 1;
          return a.keyword.length - b.keyword.length;
        });
    }

    function pickBest(raw) {
      // 목록에서 고른 제목(정확 일치)은 그대로 검색
      if (useCatalog.checked && catalogReady && titles.includes(raw)) {
        const hits = countInCatalog(raw);
        return {
          keyword: raw,
          hits: hits || 1,
          ranked: [{ keyword: raw, hits: hits || 1, isRaw: true }],
          reason: `선택한 상품명 · "${raw}"`,
        };
      }

      const tokens = tokenize(raw);
      if (useCatalog.checked && catalogReady && tokens.length >= 2) {
        const cover = pickCoveringKeyword(tokens, 400);
        if (cover && cover.keyword) {
          const ranked = rankCandidates(raw);
          return {
            keyword: cover.keyword,
            hits: cover.hits,
            ranked,
            reason: `복수어 AND ${cover.hits.toLocaleString()}건 · "${cover.keyword}"`,
          };
        }
      }

      const ranked = rankCandidates(raw);
      if (!ranked.length) return { keyword: raw, hits: 0, ranked, reason: "입력어" };
      const best = ranked[0];
      if (useCatalog.checked && catalogReady && best.hits > 0) {
        return {
          keyword: best.keyword,
          hits: best.hits,
          ranked,
          reason: `상품명 목록 ${best.hits.toLocaleString()}건 · "${best.keyword}"`,
        };
      }
      const converted = ranked.find((x) => !x.isRaw);
      if (dualHanja.checked && converted) {
        return {
          keyword: converted.keyword,
          hits: converted.hits,
          ranked,
          reason: `변환 후보 · "${converted.keyword}"`,
        };
      }
      return {
        keyword: raw,
        hits: best.hits,
        ranked,
        reason: `입력어 · "${raw}"`,
      };
    }

    function findTitleMatches(query, limit) {
      if (!catalogReady || !query || query.length < 1) return [];
      const tokens = tokenize(query);
      if (tokens.length >= 2) {
        const matches = findAndTitles(tokens, Math.max(limit * 4, 40));
        return matches
          .map((title) => ({
            title,
            span: shortestCoveringSpan(title, tokens) || title,
          }))
          .sort((a, b) => a.span.length - b.span.length || a.title.length - b.title.length)
          .slice(0, limit)
          .map((x) => x.title);
      }

      const starts = [];
      const middles = [];
      for (let i = 0; i < titles.length; i++) {
        const t = titles[i];
        const vars = tokenVariants(query);
        let idx = -1;
        for (let v = 0; v < vars.length; v++) {
          const at = t.indexOf(vars[v]);
          if (at >= 0 && (idx < 0 || at < idx)) idx = at;
        }
        if (idx < 0) continue;
        if (idx === 0) starts.push(t);
        else middles.push(t);
        if (starts.length >= limit) break;
      }
      return starts.concat(middles).slice(0, limit);
    }

    function extractKeyFromTitle(title, query) {
      const tokens = tokenize(query);
      if (tokens.length >= 2) {
        const span = shortestCoveringSpan(title, tokens);
        if (span) return span;
      }
      const ranked = rankCandidates(query);
      for (let i = 0; i < ranked.length; i++) {
        if (title.includes(ranked[i].keyword) && ranked[i].keyword.length >= 2) {
          return ranked[i].keyword;
        }
      }
      if (title.includes(query)) return query;
      return title;
    }

    function closeSuggest() {
      suggestEl.classList.remove("open");
      suggestItems = [];
      suggestIndex = -1;
      suggestEl.innerHTML = "";
    }

    function renderSuggest(query, opts) {
      const keepIndex = !!(opts && opts.keepIndex);
      if (!catalogReady || !query || query.length < 1) {
        closeSuggest();
        return;
      }
      const matches = findTitleMatches(query, MAX_SUGGEST);
      suggestItems = matches;
      if (!matches.length) {
        closeSuggest();
        return;
      }
      if (!keepIndex || suggestIndex < 0) suggestIndex = 0;
      if (suggestIndex >= matches.length) suggestIndex = matches.length - 1;
      suggestEl.innerHTML = matches
        .map((title, i) => {
          return `<button type="button" role="option" data-i="${i}" class="${i === suggestIndex ? "active" : ""}">${escapeHtml(title)}<span class="meta">이 제목으로 검색</span></button>`;
        })
        .join("");
      suggestEl.classList.add("open");
    }

    function applySuggest(i, doSearch) {
      const title = suggestItems[i];
      if (!title) return;
      keywordInput.value = title;
      closeSuggest();
      renderPreview();
      if (doSearch) {
        openSearch();
      } else {
        keywordInput.focus();
      }
    }

    function renderPreview() {
      const raw = getRawKeyword();
      const source = getSource();
      if (!raw) {
        chips.innerHTML = '<span class="muted">검색어를 입력하면 후보가 표시됩니다.</span>';
        return;
      }
      const ranked = rankCandidates(raw).slice(0, MAX_CANDIDATES);
      const bestKey = ranked[0] && ranked[0].hits > 0 ? ranked[0].keyword : null;
      const parts = [`<span class="chip source">${sourceLabel(source)}</span>`];
      ranked.forEach((item) => {
        const cls = [
          item.keyword === bestKey ? "best" : item.isRaw ? "primary" : "converted",
          "chip",
        ].join(" ");
        const label = item.isRaw ? "입력" : "후보";
        parts.push(
          `<button type="button" class="${cls}" data-kw="${escapeHtml(item.keyword)}">${label}: ${escapeHtml(item.keyword)}<span class="n">${item.hits.toLocaleString()}건</span></button>`
        );
      });
      chips.innerHTML = parts.join("");
    }

    function updateHintDefault() {
      const source = getSource();
      hint.innerHTML =
        source === "yanghang"
          ? "화동양행 원본 검색을 새 창 1개로 엽니다. 목록 매칭이 많은 표기를 우선합니다."
          : "화동옥션 원본 검색을 새 창 1개로 엽니다. 목록 매칭이 많은 표기를 우선합니다.";
    }

    async function resolveApiBase() {
      for (const base of API_BASES) {
        try {
          const res = await fetch(base + "/api/health", { cache: "no-store" });
          if (res.ok) return base;
        } catch (e) {}
      }
      return null;
    }

    async function fetchAuctionTotal(apiBase, keyword) {
      const res = await fetch(apiBase + "/api/site-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          keyword: keyword || "",
          page: "1",
          listSizeNum: "50",
          size: "1",
        }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json.code && json.code !== "SUCC") throw new Error(json.msg || "API 오류");
      return Number((json.map || {}).total || 0);
    }

    async function fetchYanghangTotal(apiBase, keyword) {
      const res = await fetch(apiBase + "/api/yanghang-total", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keyword: keyword || "" }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json.code && json.code !== "SUCC") throw new Error(json.msg || "API 오류");
      return Number(json.total || 0);
    }

    async function fetchTotal(apiBase, keyword, source) {
      if (source === "yanghang") return fetchYanghangTotal(apiBase, keyword);
      return fetchAuctionTotal(apiBase, keyword);
    }

    async function chooseKeyword(raw, source) {
      const catalogPick = pickBest(raw);
      if (useCatalog.checked && catalogReady && catalogPick.hits > 0) {
        return { ...catalogPick, proxy: false, via: "catalog" };
      }

      const apiBase = await resolveApiBase();
      const ranked = catalogPick.ranked || rankCandidates(raw);
      if (!apiBase) {
        return {
          keyword: catalogPick.keyword,
          hits: catalogPick.hits,
          ranked,
          reason: catalogPick.reason + " · 목록/변환 기준",
          proxy: false,
          via: "fallback",
        };
      }

      for (const item of ranked.slice(0, 6)) {
        const total = await fetchTotal(apiBase, item.keyword, source);
        if (total > 0) {
          return {
            keyword: item.keyword,
            hits: total,
            ranked,
            reason: `${sourceLabel(source)} 실시간 ${total.toLocaleString()}건 · "${item.keyword}"`,
            proxy: true,
            via: "proxy",
          };
        }
      }

      return {
        keyword: catalogPick.keyword || raw,
        hits: 0,
        ranked,
        reason: `${sourceLabel(source)} 실시간 0건 · "${catalogPick.keyword || raw}"로 1창`,
        proxy: true,
        via: "proxy-empty",
      };
    }

    async function openSearch() {
      const raw = getRawKeyword();
      if (!raw) {
        keywordInput.focus();
        alert("검색어를 입력하세요.");
        return;
      }

      closeSuggest();
      const source = getSource();
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("팝업이 차단되었습니다. 이 사이트의 팝업을 허용해 주세요.");
        return;
      }
      try {
        win.document.write(
          "<!doctype html><title>검색 준비</title><body style='font-family:sans-serif;padding:24px;color:#334155'>최적 검색어 확인 중…</body>"
        );
        win.document.close();
      } catch (e) {}

      btnSearch.disabled = true;
      hint.textContent = `${sourceLabel(source)} · 최적 검색어 확인 중…`;

      try {
        const chosen = await chooseKeyword(raw, source);
        win.location.href = buildSearchUrl(chosen.keyword, source);
        hint.innerHTML = `${escapeHtml(chosen.reason)} · 열린 검색어: <code>${escapeHtml(chosen.keyword)}</code>`;
      } catch (e) {
        const fallback = pickBest(raw).keyword || raw;
        win.location.href = buildSearchUrl(fallback, source);
        hint.textContent = `확인 실패(${e.message}) · "${fallback}"로 1창 열림.`;
      } finally {
        btnSearch.disabled = false;
        renderPreview();
      }
    }

    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        renderPreview();
        renderSuggest(getRawKeyword());
      }, 80);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (suggestEl.classList.contains("open") && suggestIndex >= 0) {
        applySuggest(suggestIndex, true);
        return;
      }
      openSearch();
    });

    keywordInput.addEventListener("input", schedulePreview);
    keywordInput.addEventListener("keydown", (e) => {
      if (!suggestEl.classList.contains("open") || !suggestItems.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        suggestIndex = (suggestIndex + 1) % suggestItems.length;
        renderSuggest(getRawKeyword(), { keepIndex: true });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        suggestIndex = (suggestIndex - 1 + suggestItems.length) % suggestItems.length;
        renderSuggest(getRawKeyword(), { keepIndex: true });
      } else if (e.key === "Escape") {
        closeSuggest();
      }
    });

    suggestEl.addEventListener("mousedown", (e) => {
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      e.preventDefault();
      applySuggest(Number(btn.getAttribute("data-i")), true);
    });

    chips.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-kw]");
      if (!btn) return;
      keywordInput.value = btn.getAttribute("data-kw") || "";
      renderPreview();
      renderSuggest(getRawKeyword());
      keywordInput.focus();
    });

    useCatalog.addEventListener("change", renderPreview);
    dualHanja.addEventListener("change", renderPreview);
    form.querySelectorAll('input[name="searchSource"]').forEach((el) => {
      el.addEventListener("change", () => {
        updateHintDefault();
        renderPreview();
      });
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      keywordInput.value = "";
      useCatalog.checked = true;
      dualHanja.checked = true;
      const auctionRadio = form.querySelector('input[name="searchSource"][value="auction"]');
      if (auctionRadio) auctionRadio.checked = true;
      closeSuggest();
      updateHintDefault();
      renderPreview();
      keywordInput.focus();
    });

    document.getElementById("btnOpenList").addEventListener("click", () => {
      window.open(AUCTION_LIST_URL, "_blank", "noopener,noreferrer");
    });
    document.getElementById("btnOpenYanghang").addEventListener("click", () => {
      window.open(YANGHANG_SEARCH_URL, "_blank", "noopener,noreferrer");
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) closeSuggest();
    });

    async function loadCatalog() {
      try {
        const res = await fetch("titles.json", { cache: "force-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        titles = Array.isArray(data) ? data : [];
        catalogReady = titles.length > 0;
        catalogStatus.textContent = catalogReady
          ? `상품명 목록 ${titles.length.toLocaleString()}건 준비됨`
          : "상품명 목록이 비어 있습니다. 변환 후보만 사용합니다.";
      } catch (e) {
        catalogReady = false;
        titles = [];
        catalogStatus.textContent = "상품명 목록 로드 실패 · 한자 변환 후보만 사용합니다.";
      }
      renderPreview();
    }

    updateHintDefault();
    renderPreview();
    loadCatalog();
  </script>
</body>
</html>
