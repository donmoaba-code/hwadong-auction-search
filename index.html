<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화동경매 검색툴 V26.08.01</title>
  <style>
    :root {
      --bg: #f3efe8;
      --panel: #fffdf9;
      --ink: #1f2933;
      --muted: #667788;
      --line: #d8cfc3;
      --accent: #9a3412;
      --accent-soft: #c2410c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(154, 52, 18, 0.10), transparent 55%),
        linear-gradient(180deg, #f7f2ea 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(620px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 24px;
      box-shadow: 0 18px 40px rgba(60, 40, 20, 0.08);
    }
    h1 {
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .desc {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .desc a { color: var(--accent-soft); }
    label.field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .source-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #faf7f2;
    }
    .source-box label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="search"] {
      flex: 1 1 200px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
      background: #fff;
    }
    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.12);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-search {
      background: var(--accent);
      color: #fff;
    }
    .btn-search:hover { background: var(--accent-soft); }
    .btn-search:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-reset {
      background: #efe8de;
      color: var(--ink);
    }
    .btn-reset:hover { background: #e5ddd1; }
    .options {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      font-size: 0.88rem;
    }
    .options label.chk {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      cursor: pointer;
      margin: 0;
    }
    .preview {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #faf7f2;
      min-height: 52px;
    }
    .preview-title {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.84rem;
    }
    .chip.primary {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .chip.converted {
      border-color: #b45309;
      background: #fff7ed;
    }
    .chip.source {
      border-color: #1d4ed8;
      background: #eff6ff;
      color: #1e3a8a;
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .muted { color: var(--muted); font-size: 0.84rem; }
  </style>
  <script src="hanja_convert.js"></script>
</head>
<body>
  <main class="card">
    <h1>화동경매 검색툴 V26.08.01</h1>
    <p class="desc" id="desc">
      <a href="https://www.hwadongauction.com/search/search" target="_blank" rel="noopener">화동옥션</a>
      또는
      <a href="https://www.hwadong.com/new/search/auctionSearch.jsp" target="_blank" rel="noopener">화동양행</a>
      원본 검색을 새 창으로 엽니다.
    </p>

    <form id="searchForm">
      <div class="source-box" role="radiogroup" aria-label="검색 대상">
        <label>
          <input type="radio" name="searchSource" value="auction" checked />
          화동옥션 검색
        </label>
        <label>
          <input type="radio" name="searchSource" value="yanghang" />
          화동양행 검색
        </label>
      </div>

      <label class="field-label" for="keyword">검색어 (상품명 / 상품번호 / Lot번호)</label>
      <div class="row">
        <input
          type="search"
          id="keyword"
          name="keyword"
          placeholder="예: 제일은행, 백동화, 중국"
          autocomplete="off"
          autofocus
        />
        <button type="submit" class="btn-search" id="btnSearch">검색 (원본 새 창)</button>
        <button type="button" class="btn-reset" id="btnReset">초기화</button>
      </div>

      <div class="options">
        <label class="chk">
          <input type="checkbox" id="dualHanja" checked />
          한글 결과 없을 때 한자로 열기
        </label>
      </div>
    </form>

    <div class="preview" id="preview">
      <div class="preview-title">검색 후보</div>
      <div class="chips" id="chips"><span class="muted">검색어를 입력하면 미리보기가 표시됩니다.</span></div>
    </div>

    <p class="hint" id="hint">
      검색어를 변환·선택한 뒤 원본 사이트 창 <b>1개</b>만 엽니다.
      인터넷 배포본은 바로 사용 가능합니다. (로컬 프록시가 있으면 한글 결과 건수를 더 정확히 판별합니다.)
    </p>

    <div class="actions">
      <button type="button" class="btn-reset" id="btnOpenList">화동옥션 종료경매 목록</button>
      <button type="button" class="btn-reset" id="btnOpenYanghang">화동양행 검색 페이지</button>
    </div>
  </main>

  <script>
    const AUCTION_SEARCH_URL = "https://www.hwadongauction.com/search/search";
    const AUCTION_LIST_URL = "https://www.hwadongauction.com/end/endAuctionList";
    const YANGHANG_SEARCH_URL = "https://www.hwadong.com/new/search/auctionSearch.jsp";
    const API_BASES = ["http://127.0.0.1:8765", ""];
    const MAX_CONVERT = 3;

    const form = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const dualHanja = document.getElementById("dualHanja");
    const chips = document.getElementById("chips");
    const hint = document.getElementById("hint");
    const btnSearch = document.getElementById("btnSearch");

    function getSource() {
      const el = form.querySelector('input[name="searchSource"]:checked');
      return el ? el.value : "auction";
    }

    function buildSearchUrl(keyword, source) {
      if (source === "yanghang") {
        const url = new URL(YANGHANG_SEARCH_URL);
        url.searchParams.set("hiddenSearchKey", keyword);
        url.searchParams.set("resultsearch", "Y");
        url.searchParams.set("Page", "1");
        return url.toString();
      }
      const url = new URL(AUCTION_SEARCH_URL);
      url.searchParams.set("keyword", keyword);
      return url.toString();
    }

    function getHangulKeyword() {
      return keywordInput.value.trim();
    }

    function getHanjaCandidates(raw) {
      if (!raw || !dualHanja.checked || !window.HwadongHanja) return [];
      return HwadongHanja.expandSearchKeywords(raw)
        .filter((k) => k !== raw)
        .slice(0, MAX_CONVERT);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sourceLabel(source) {
      return source === "yanghang" ? "화동양행" : "화동옥션";
    }

    function renderPreview() {
      const raw = getHangulKeyword();
      const source = getSource();
      const converted = getHanjaCandidates(raw);
      if (!raw) {
        chips.innerHTML = '<span class="muted">검색어를 입력하면 미리보기가 표시됩니다.</span>';
        return;
      }
      const parts = [
        `<span class="chip source">${sourceLabel(source)}</span>`,
        `<span class="chip primary">한글: ${escapeHtml(raw)}</span>`,
      ];
      converted.forEach((k) => {
        parts.push(`<span class="chip converted">한자 후보: ${escapeHtml(k)}</span>`);
      });
      chips.innerHTML = parts.join("");
    }

    function updateHintDefault() {
      const source = getSource();
      if (source === "yanghang") {
        hint.innerHTML =
          "화동양행(<code>auctionSearch.jsp</code>) 원본 검색을 새 창 1개로 엽니다. 한자 후보가 있으면 함께 미리보기에 표시됩니다.";
      } else {
        hint.innerHTML =
          "화동옥션 원본 검색을 새 창 1개로 엽니다. 한자 후보가 있으면 함께 미리보기에 표시됩니다.";
      }
    }

    async function resolveApiBase() {
      for (const base of API_BASES) {
        try {
          const res = await fetch(base + "/api/health", { cache: "no-store" });
          if (res.ok) return base;
        } catch (e) {}
      }
      return null;
    }

    async function fetchAuctionTotal(apiBase, keyword) {
      const res = await fetch(apiBase + "/api/site-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          keyword: keyword || "",
          page: "1",
          listSizeNum: "50",
          size: "1",
        }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json.code && json.code !== "SUCC") throw new Error(json.msg || "API 오류");
      return Number((json.map || {}).total || 0);
    }

    async function fetchYanghangTotal(apiBase, keyword) {
      const res = await fetch(apiBase + "/api/yanghang-total", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keyword: keyword || "" }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json.code && json.code !== "SUCC") throw new Error(json.msg || "API 오류");
      return Number(json.total || 0);
    }

    async function fetchTotal(apiBase, keyword, source) {
      if (source === "yanghang") return fetchYanghangTotal(apiBase, keyword);
      return fetchAuctionTotal(apiBase, keyword);
    }

    async function chooseKeyword(raw, hanjaList, source) {
      const apiBase = await resolveApiBase();
      if (!apiBase) {
        return {
          keyword: hanjaList[0] || raw,
          reason: hanjaList.length
            ? `프록시 미연결 · ${sourceLabel(source)} 한자 후보로 1창`
            : `프록시 미연결 · ${sourceLabel(source)} 한글 1창`,
          proxy: false,
        };
      }

      const hangulTotal = await fetchTotal(apiBase, raw, source);
      if (hangulTotal > 0) {
        return {
          keyword: raw,
          reason: `${sourceLabel(source)} 한글 ${hangulTotal.toLocaleString()}건 · 1창`,
          proxy: true,
        };
      }

      for (const hj of hanjaList) {
        const total = await fetchTotal(apiBase, hj, source);
        if (total > 0) {
          return {
            keyword: hj,
            reason: `${sourceLabel(source)} 한글 0건 → 한자 "${hj}" ${total.toLocaleString()}건 · 1창`,
            proxy: true,
          };
        }
      }

      return {
        keyword: raw,
        reason: `${sourceLabel(source)} 한글·한자 모두 0건 · 한글 페이지 1창`,
        proxy: true,
      };
    }

    async function openSearch() {
      const raw = getHangulKeyword();
      if (!raw) {
        keywordInput.focus();
        alert("검색어를 입력하세요.");
        return;
      }

      const source = getSource();
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("팝업이 차단되었습니다. 이 사이트의 팝업을 허용해 주세요.");
        return;
      }
      try {
        win.document.write(
          "<!doctype html><title>검색 준비</title><body style='font-family:sans-serif;padding:24px;color:#334155'>검색어 확인 중…</body>"
        );
        win.document.close();
      } catch (e) {}

      btnSearch.disabled = true;
      hint.textContent = `${sourceLabel(source)} · 한글 결과 유무 확인 중…`;

      try {
        const hanjaList = getHanjaCandidates(raw);
        const chosen = await chooseKeyword(raw, dualHanja.checked ? hanjaList : [], source);
        win.location.href = buildSearchUrl(chosen.keyword, source);
        hint.innerHTML = `${escapeHtml(chosen.reason)} · 열린 검색어: <code>${escapeHtml(chosen.keyword)}</code>`;
        if (!chosen.proxy) {
          hint.innerHTML += " · 결과 건수 판별 없이 후보 검색어로 열었습니다.";
        }
      } catch (e) {
        const hanjaList = getHanjaCandidates(raw);
        const fallback = (dualHanja.checked && hanjaList[0]) || raw;
        win.location.href = buildSearchUrl(fallback, source);
        hint.textContent = `확인 실패(${e.message}) · "${fallback}"로 1창 열림.`;
      } finally {
        btnSearch.disabled = false;
        renderPreview();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      openSearch();
    });

    keywordInput.addEventListener("input", renderPreview);
    dualHanja.addEventListener("change", renderPreview);
    form.querySelectorAll('input[name="searchSource"]').forEach((el) => {
      el.addEventListener("change", () => {
        updateHintDefault();
        renderPreview();
      });
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      keywordInput.value = "";
      dualHanja.checked = true;
      const auctionRadio = form.querySelector('input[name="searchSource"][value="auction"]');
      if (auctionRadio) auctionRadio.checked = true;
      updateHintDefault();
      renderPreview();
      keywordInput.focus();
    });

    document.getElementById("btnOpenList").addEventListener("click", () => {
      window.open(AUCTION_LIST_URL, "_blank", "noopener,noreferrer");
    });
    document.getElementById("btnOpenYanghang").addEventListener("click", () => {
      window.open(YANGHANG_SEARCH_URL, "_blank", "noopener,noreferrer");
    });

    updateHintDefault();
    renderPreview();
  </script>
</body>
</html>
